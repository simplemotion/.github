# PR gate — INLINED, deliberately NOT the canonical sm-pr caller stub.
#
# The `-inline` suffix marks a fork of a shared workflow, never the
# byte-identical caller stub every other repo carries at `sm-pr.yml`.
#
# Do NOT "restore" this to
# `uses: 3400-0000-SM-Software/3400-9992-SM-PR/.github/workflows/sm-pr.yml@main`.
#
# **This repo is public; sm-pr is internal.** GitHub does not permit a public
# repository to call a reusable workflow from an internal or private one. The
# call is refused before any job is created, so the run fails at startup with
# zero jobs and nothing is validated.
#
# That is not a prediction, and not only sm-install's history. It happened HERE:
# `sm-ci.yml` was the canonical caller stub and failed at startup on 2026-08-22,
# the run appearing under the workflow's FILE PATH rather than its `name:` field,
# which is the tell that GitHub never parsed it. A caller stub for sm-pr was
# opened against this repo the same day and closed unmerged for this reason.
#
# `simplemotion/.github` must stay public: it serves the organisation profile and
# the banner assets that every repo's README references by raw.githubusercontent
# URL. So the gate is inlined instead.
#
# Adapted from `simplemotion/sm-install/.github/workflows/sm-pr-inline.yml`, the
# first repo to hit this. Its `render` job shellchecks sm-install-lib.sh,
# sm-install.sh, sm-welcome.sh and tests/*.sh — this repo has no shell scripts,
# so that job is deliberately absent rather than copied and left to fail. The
# hygiene job below is the part that applies, and matches what the shared
# workflow would actually have run here: sm-pr's Rust job is gated on
# Cargo.toml + rust-toolchain.toml, and this repo has neither.

name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required top-level files present
        run: |
          set -euo pipefail
          missing=0
          for f in ASSIGN.md CHANGE.md CLAUDE.md README.md SECURE.md .gitignore; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required top-level file missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: ASSIGN.md states the assignment, the licence and the copyright
        run: |
          set -euo pipefail
          # Asserts substantive content rather than byte-comparing to canonical:
          # a pinned blob SHA fails every repo the moment canonical changes,
          # before a sweep can land. Robust to wording edits, still catches the
          # real defect class (a 2026-08-04 audit found 203 of 414 ASSIGN.md
          # files missing the MIT section and the copyright line).
          fail=0
          if ! grep -qF 'SimpleMotion.Global Pty Ltd' ASSIGN.md; then
            echo "::error file=ASSIGN.md::no assignee named — must be SimpleMotion.Global Pty Ltd"
            fail=1
          fi
          if ! grep -qE '^#+[[:space:]]*MIT License' ASSIGN.md; then
            echo "::error file=ASSIGN.md::missing the MIT License section"
            fail=1
          fi
          if ! grep -qE 'Copyright \(c\) [0-9]{4} SimpleMotion\.Global Pty Ltd' ASSIGN.md; then
            echo "::error file=ASSIGN.md::missing the 'Copyright (c) <year> SimpleMotion.Global Pty Ltd' line"
            fail=1
          fi
          if [ "$fail" != 0 ]; then
            echo "::notice::canonical copy: 9000-0000-SM-Govern/9000-9001-SM-Dot-Claude-Base/ASSIGN.md"
          fi
          exit "$fail"

      - name: .gitmodules declares path, url, branch on every entry
        if: hashFiles('.gitmodules') != ''
        run: |
          python3 <<'PY'
          import configparser, sys
          cp = configparser.ConfigParser()
          cp.read(".gitmodules")
          fail = False
          for section in cp.sections():
              for key in ("path", "url", "branch"):
                  if not cp.has_option(section, key):
                      print(f"::error::{section} missing required key '{key}' in .gitmodules")
                      fail = True
          sys.exit(1 if fail else 0)
          PY

      - name: CHANGE.md has at least one version entry
        run: |
          set -euo pipefail
          # SemVer 2.0.0 vX.Y.Z, optionally with a channel/-rc suffix, per the
          # enterprise versioning policy. Legacy vW.X.Y.Z entries also pass.
          if ! grep -qE 'v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+|-[a-z]+-[0-9]+|-rc-[0-9]+)?' CHANGE.md; then
            echo "::error file=CHANGE.md::must contain at least one version (vX.Y.Z, vX.Y.Z-<channel>-NNN, vX.Y.Z-rc-NNN, or legacy vW.X.Y.Z)"
            exit 1
          fi

      - name: CHANGE.md uses the canonical 5-column table
        run: |
          set -euo pipefail
          # Canonical is `| Version | Hash | Date | Author | Notes |`. The Hash
          # column arrived with that format; repos that never migrated carried
          # `| Version | Date | Author | Notes |` — 203 of 414 at the 2026-08-04
          # audit, all since migrated.
          #
          # EVERY pre-appendix table is checked, not just the first: files
          # typically carry two (the main changelog and a retired `## Legacy`
          # stream) and those drifted independently. Stops at the appendix marker,
          # because the versioning-policy appendix has its own `| Version |` table
          # held byte-identical to canonical by sm-reconcile-appendix.sh — not this
          # workflow's business to judge.
          # Checks the HEADER and every DATA ROW beneath it. It used to match
          # only `| Version |` lines, so it verified that a table DECLARED five
          # columns and never counted cells on a row — which is how 17 malformed
          # rows across 8 repos passed it for months. Three shapes got through:
          # a bare pipe in the Notes prose, a backslash-escaped pipe (renders
          # correctly, still splits the row for any counter), and a row missing
          # its closing pipe. Write an interior pipe as &#124;.
          bad=$(awk '
            /^#+[[:space:]]*[Aa]ppendix/ { exit }
            /^\|/ {
              n = gsub(/\|/, "|") - 1
              if ($0 ~ /^\|[[:space:]]*Version[[:space:]]*\|/) { intable = 1 }
              if (intable && n != 5) { print FNR }
              next
            }
            { intable = 0 }
          ' CHANGE.md)
          if [ -n "$bad" ]; then
            while IFS= read -r ln; do
              echo "::error file=CHANGE.md,line=${ln}::changelog table is not 5-column — expected | Version | Hash | Date | Author | Notes |"
            done <<< "$bad"
            exit 1
          fi

      - name: CHANGE.md tracks the develop tag stream
        # The changelog is DERIVED from git, not maintained beside it. Every
        # *-develop-NNN tag gets a row whose Hash and Date come from the commit
        # that tag points at, so the three cannot drift.
        #
        # Advisory by default (require_changelog_stream: false) and hard once a
        # repo is backfilled. The advisory branch handles its own failure inside
        # this run: block rather than via continue-on-error, per CLAUDE.md — an
        # advisory check must not be able to fail the job, and the keyword is
        # indiscriminate about what else it swallows.
        #
        # Rows for versions with no tag are ignored, so the history each repo
        # accumulated before it started tagging stays untouched. One leading
        # (auto) row is allowed: the newest change's tag is minted after merge,
        # so at PR time its key cannot exist yet.
        run: |
          set -uo pipefail
          MODE=advisory
          if [ "true" = "true" ]; then MODE=hard; fi
          # The hygiene checkout is shallow and carries no tags. Fetch tag tips
          # only, at depth 1 — a full-history clone on every PR in every repo is
          # the kind of cost -030 was raised to cut.
          git fetch --quiet --tags --depth=1 origin 2>/dev/null || true
          tags=$(git tag -l '*develop-*' | sed -E 's/.*develop-0*([0-9]+)$/\1 &/' | sort -n | cut -d' ' -f2)
          if [ -z "$tags" ]; then
            echo "no develop tags — nothing to check"
            exit 0
          fi
          newest=$(printf '%s\n' "$tags" | tail -1)
          problems=0
          report() {
            if [ "$MODE" = hard ]; then
              echo "::error file=CHANGE.md::$1"
            else
              echo "::warning file=CHANGE.md::$1"
            fi
            problems=$((problems + 1))
          }
          # Only `(auto)` rows INSIDE the stream are held to the one-placeholder
          # rule. A row below the oldest tag is frozen history — written before
          # the repo ever stamped a version, with no tag to derive one from, and
          # preserved verbatim. 9001-9003-SM-Executive-Dot-Claude carries 12.
          oldest=$(printf '%s\n' "$tags" | head -1)
          oldest_ln=$(grep -n -m1 -E "^\| *\`?${oldest}\`? *\|" CHANGE.md | cut -d: -f1 || true)
          if [ -n "$oldest_ln" ]; then
            autos=$(awk -v n="$oldest_ln" '$0 ~ /^\| *\(auto\) *\|/ && NR < n { c++ } END { print c+0 }' CHANGE.md)
          else
            autos=$(grep -cE '^\| *\(auto\) *\|' CHANGE.md || true)
          fi
          if [ "$autos" -gt 1 ]; then
            report "$autos rows inside the tag stream are still (auto); only the newest may be, until its tag is minted"
          fi
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            sha=$(git rev-list -n1 "$t" 2>/dev/null) || continue
            [ -n "$sha" ] || continue
            short=$(git rev-parse --short=7 "$sha")
            when=$(TZ=UTC0 git log -1 --date=format-local:'%Y-%m-%d %H:%M UTC' --format=%cd "$sha")
            row=$(grep -m1 -E "^\| *\`?${t}\`? *\|" CHANGE.md || true)
            if [ -z "$row" ]; then
              # The NEWEST tag is allowed to have no row yet. It was minted by
              # the merge that just happened, after the PR which would have
              # documented it — so demanding a row here would fail every PR
              # that follows a merge, forever. The in-flight `(auto)` row is
              # what becomes this row, and the count is capped above.
              if [ "$t" = "$newest" ]; then
                echo "$t has no row yet — minted by the last merge, expected"
                continue
              fi
              report "$t is tagged but no changelog row names it"
              continue
            fi
            got_h=$(printf '%s' "$row" | awk -F'|' '{gsub(/[ `]/,"",$3); print $3}')
            got_d=$(printf '%s' "$row" | awk -F'|' '{gsub(/`/,"",$4); gsub(/^ +| +$/,"",$4); print $4}')
            [ "$got_h" = "$short" ] || report "$t: Hash is ${got_h:-empty}, git says $short"
            [ "$got_d" = "$when" ] || report "$t: Date is ${got_d:-empty}, git says $when"
          done < <(printf '%s\n' "$tags")
          if [ "$problems" -eq 0 ]; then
            echo "CHANGE.md tracks the develop stream"
            exit 0
          fi
          echo "$problems problem(s) between CHANGE.md and the develop tag stream"
          if [ "$MODE" = hard ]; then exit 1; fi
          echo "advisory — set require_changelog_stream: true once this repo is backfilled"

      - name: No bootstrap / rendered artefacts committed
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              .placeholder|out/*|*.key|*.pem)
                echo "::error file=$f::forbidden artefact committed (bootstrap or rendered file)"
                fail=1
                ;;
            esac
          done < <(git ls-files)
          exit "$fail"

      - name: SimpleMotion-authored scripts + workflows have sm- prefix
        # Every SimpleMotion-authored script and workflow file must have a
        # basename starting with `sm-`. This cited DISTRIBUTE.md principle 9
        # until 2026-08-17; that document exists in no repo and no checkout,
        # so the citation pointed developers at nothing. The rule is now
        # documented in simplemotion/sm-pr's README. Every SimpleMotion-
        # authored script and
        # workflow file must have a basename starting with `sm-`. Third-party
        # installs keep upstream names but we don't track those. Scope:
        #   - .sm-scripts/**/*.{sh,bash,zsh,py,ps1}
        #   - .github/workflows/*.yml
        # Other .github/ yaml (issue templates, CODEOWNERS, dependabot) follow
        # GitHub's mandated filenames and are exempt.
        #
        # Python exception: importable modules (basename is the import
        # identifier) may use the underscore variant `sm_*.py` since `-` is
        # invalid in identifiers. Shell/PowerShell/YAML get no such exception.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$f" in
              *.py)
                case "$base" in
                  sm-*|sm_*) : ;;
                  *)
                    echo "::error file=$f::SimpleMotion-authored Python module must have an sm- or sm_ prefix (rename to sm-${base} for standalone scripts, or sm_${base#*_} / sm_${base%.py}.py for importable modules). Rule: simplemotion/sm-pr README, sm-* prefix on authored artefacts."
                    fail=1
                    ;;
                esac
                ;;
              *)
                case "$base" in
                  sm-*) : ;;
                  *)
                    echo "::error file=$f::SimpleMotion-authored artefact must have an sm- prefix (rename to sm-${base}). Rule: simplemotion/sm-pr README, sm-* prefix on authored artefacts."
                    fail=1
                    ;;
                esac
                ;;
            esac
          done < <(git ls-files \
            '.sm-scripts/**/*.sh' \
            '.sm-scripts/**/*.bash' \
            '.sm-scripts/**/*.zsh' \
            '.sm-scripts/**/*.py' \
            '.sm-scripts/**/*.ps1' \
            '.github/workflows/*.yml')
          exit "$fail"
